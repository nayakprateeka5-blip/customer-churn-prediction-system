<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 6px;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 14px;
        }

        button {
            display: block;
            margin: 30px auto 0;
            padding: 13px 35px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .yes {
            background: #ffe5e5;
        }

        .no {
            background: #e5f7e5;
        }

        .error {
            background: #fff0cc;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Customer Churn Prediction</h1>

        <p class="subtitle">
            Enter customer details to predict whether the customer is likely to churn.
        </p>

        <div class="form-grid">

            <div class="form-group">
                <label>Gender</label>
                <select id="gender">
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                </select>
            </div>

            <div class="form-group">
                <label>Senior Citizen</label>
                <select id="SeniorCitizen">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label>Partner</label>
                <select id="Partner">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="form-group">
                <label>Dependents</label>
                <select id="Dependents">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tenure (months)</label>
                <input type="number" id="tenure" value="5" min="0">
            </div>

            <div class="form-group">
                <label>Phone Service</label>
                <select id="PhoneService">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="form-group">
                <label>Multiple Lines</label>
                <select id="MultipleLines">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No phone service">No phone service</option>
                </select>
            </div>

            <div class="form-group">
                <label>Internet Service</label>
                <select id="InternetService">
                    <option value="DSL">DSL</option>
                    <option value="Fiber optic">Fiber optic</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="form-group">
                <label>Online Security</label>
                <select id="OnlineSecurity">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <div class="form-group">
                <label>Online Backup</label>
                <select id="OnlineBackup">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <div class="form-group">
                <label>Device Protection</label>
                <select id="DeviceProtection">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tech Support</label>
                <select id="TechSupport">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <div class="form-group">
                <label>Streaming TV</label>
                <select id="StreamingTV">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <div class="form-group">
                <label>Streaming Movies</label>
                <select id="StreamingMovies">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <div class="form-group">
                <label>Contract</label>
                <select id="Contract">
                    <option value="Month-to-month">Month-to-month</option>
                    <option value="One year">One year</option>
                    <option value="Two year">Two year</option>
                </select>
            </div>

            <div class="form-group">
                <label>Paperless Billing</label>
                <select id="PaperlessBilling">
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="form-group">
                <label>Payment Method</label>
                <select id="PaymentMethod">
                    <option value="Electronic check">Electronic check</option>
                    <option value="Mailed check">Mailed check</option>
                    <option value="Bank transfer (automatic)">
                        Bank transfer (automatic)
                    </option>
                    <option value="Credit card (automatic)">
                        Credit card (automatic)
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Monthly Charges</label>
                <input type="number" id="MonthlyCharges" value="50.50" step="0.01">
            </div>

            <div class="form-group">
                <label>Total Charges</label>
                <input type="number" id="TotalCharges" value="250.00" step="0.01">
            </div>

            <div class="form-group">
                <label>Long-Term Customer</label>
                <select id="IsLongTermCustomer">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label>Total Services</label>
                <input type="number" id="TotalServices" value="1" min="0" max="6">
            </div>

        </div>

        <button onclick="predictChurn()">
            Predict Churn
        </button>

        <div id="result"></div>

    </div>

    <script>

        async function predictChurn() {

            const resultBox = document.getElementById("result");

            const data = {

                gender: document.getElementById("gender").value,

                SeniorCitizen:
                    Number(document.getElementById("SeniorCitizen").value),

                Partner:
                    document.getElementById("Partner").value,

                Dependents:
                    document.getElementById("Dependents").value,

                tenure:
                    Number(document.getElementById("tenure").value),

                PhoneService:
                    document.getElementById("PhoneService").value,

                MultipleLines:
                    document.getElementById("MultipleLines").value,

                InternetService:
                    document.getElementById("InternetService").value,

                OnlineSecurity:
                    document.getElementById("OnlineSecurity").value,

                OnlineBackup:
                    document.getElementById("OnlineBackup").value,

                DeviceProtection:
                    document.getElementById("DeviceProtection").value,

                TechSupport:
                    document.getElementById("TechSupport").value,

                StreamingTV:
                    document.getElementById("StreamingTV").value,

                StreamingMovies:
                    document.getElementById("StreamingMovies").value,

                Contract:
                    document.getElementById("Contract").value,

                PaperlessBilling:
                    document.getElementById("PaperlessBilling").value,

                PaymentMethod:
                    document.getElementById("PaymentMethod").value,

                MonthlyCharges:
                    Number(document.getElementById("MonthlyCharges").value),

                TotalCharges:
                    Number(document.getElementById("TotalCharges").value),

                IsLongTermCustomer:
                    Number(document.getElementById("IsLongTermCustomer").value),

                TotalServices:
                    Number(document.getElementById("TotalServices").value)
            };

            try {

                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)

                });

                if (!response.ok) {
                    throw new Error("Prediction request failed.");
                }

                const prediction = await response.json();

                resultBox.style.display = "block";

                if (prediction.churn_prediction === "Yes") {

                    resultBox.className = "yes";

                    resultBox.innerHTML = `
                <h2>⚠️ Customer is likely to churn</h2>
                <p>
                    Churn Probability:
                    <strong>
                        ${(prediction.churn_probability * 100).toFixed(2)}%
                    </strong>
                </p>
            `;

                } else {

                    resultBox.className = "no";

                    resultBox.innerHTML = `
                <h2>✅ Customer is unlikely to churn</h2>
                <p>
                    Churn Probability:
                    <strong>
                        ${(prediction.churn_probability * 100).toFixed(2)}%
                    </strong>
                </p>
            `;
                }

            } catch (error) {

                resultBox.style.display = "block";
                resultBox.className = "error";

                resultBox.innerHTML = `
            <h3>Error</h3>
            <p>${error.message}</p>
        `;
            }
        }

    </script>

</body>

</html>
